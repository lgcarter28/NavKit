name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Bootstrap development environment
        run: python tools/bootstrap.py

      - name: Check copyright headers
        run: .venv/bin/python tools/copyright.py --check

      - name: Check formatting
        run: .venv/bin/python tools/format.py --check

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Bootstrap development environment
        run: python tools/bootstrap.py

      - name: Build Debug
        run: ${{ matrix.python }} tools/build.py --build-type Debug --clean

      - name: Run unit tests
        run: ${{ matrix.python }} tools/run_tests.py --build-type Debug

      - name: Run stationary simulation
        run: ${{ matrix.python }} tools/run_first_sim.py --build-type Debug

      - name: Run headless analysis
        env:
          MPLBACKEND: Agg
        run: ${{ matrix.python }} tools/run_analysis.py data/logs/stationary_gnss_demo
