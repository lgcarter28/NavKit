name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install LLVM analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy

      - name: Bootstrap development environment
        run: python tools/bootstrap.py

      - name: Check copyright headers
        run: .venv/bin/python tools/quality/copyright.py --check

      - name: Check formatting
        run: .venv/bin/python tools/quality/format.py --check

  build-test:
    name: Build and test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Bootstrap development environment
        run: python tools/bootstrap.py

      - name: Install clang-tidy
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy

      - name: Build Debug
        run: ${{ matrix.python }} tools/build.py --build-type Debug --clean --warnings-as-errors --timing-output output/logs/stationary_gnss_demo/timing.json

      - name: Record Debug artifact sizes
        run: ${{ matrix.python }} tools/profile/resource_report.py --build-type Debug --output output/logs/stationary_gnss_demo/resources-debug-${{ runner.os }}.json

      - name: Run clang-tidy
        if: runner.os == 'Linux'
        run: ${{ matrix.python }} tools/quality/format.py --check --tidy --tidy-warnings-as-errors

      - name: Run unit tests
        run: ${{ matrix.python }} tools/run_tests.py --build-type Debug --timing-output output/logs/stationary_gnss_demo/timing.json

      - name: Run stationary simulation
        run: ${{ matrix.python }} tools/run_first_sim.py --build-type Debug

      - name: Run headless analysis
        env:
          MPLBACKEND: Agg
        run: ${{ matrix.python }} tools/run_analysis.py output/logs/stationary_gnss_demo

      - name: Build Release
        run: ${{ matrix.python }} tools/build.py --build-type Release --clean --without-tests --warnings-as-errors --timing-output output/logs/stationary_gnss_demo/timing.json

      - name: Record Release artifact sizes
        run: ${{ matrix.python }} tools/profile/resource_report.py --build-type Release --output output/logs/stationary_gnss_demo/resources-release-${{ runner.os }}.json

      - name: Upload timing and resource artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stationary-gnss-runtime-${{ runner.os }}
          path: output/logs/stationary_gnss_demo

  coverage:
    name: Coverage report
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Install coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcovr

      - name: Bootstrap development environment
        run: python tools/bootstrap.py

      - name: Generate coverage report
        run: .venv/bin/python tools/quality/coverage.py --html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/coverage
